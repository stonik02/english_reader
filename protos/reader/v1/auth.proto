syntax = "proto3";

package reader.v1;

option go_package = "github.com/deniskrylov/english-reader/backend/gen/reader/v1;readerv1";

service AuthService {
  rpc Register(RegisterRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc Refresh(RefreshRequest) returns (AuthResponse);
  rpc Logout(LogoutRequest) returns (Empty);
  rpc GetMe(GetMeRequest) returns (UserResponse);
}

message Empty {}
message User { string id = 1; string email = 2; string created_at = 3; }
message AuthResponse { User user = 1; string access_token = 2; string refresh_token = 3; int64 access_token_expires_unix = 4; }
message RegisterRequest { string email = 1; string password = 2; string device_label = 3; }
message LoginRequest { string email = 1; string password = 2; string device_label = 3; }
message RefreshRequest { string refresh_token = 1; string device_label = 2; }
message LogoutRequest { string refresh_token = 1; }
message GetMeRequest { string access_token = 1; }
message UserResponse { User user = 1; }
