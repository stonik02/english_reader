services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: reader
      POSTGRES_USER: reader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reader -d reader"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  libretranslate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: en,ru
      LT_UPDATE_MODELS: "true"
      LT_THREADS: "2"
    volumes:
      - libretranslate-models:/home/libretranslate/.local:rw

  api:
    build:
      context: ../../backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      GRPC_ADDR: :9090
      HTTP_ADDR: :8081
      FRONTEND_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env}
      DATABASE_URL: postgres://reader:${POSTGRES_PASSWORD}@postgres:5432/reader?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 720h
      SHUTDOWN_TIMEOUT: 10s
      BOOK_STORAGE_PATH: /var/lib/english-reader/books
      TRANSLATE_URL: http://libretranslate:5000
      TRANSLATE_TIMEOUT: 2s
      TRANSLATE_CACHE_TTL: 168h
      LOOKUP_WORD_MAX_LENGTH: "96"
      LOOKUP_SENTENCE_MAX_LENGTH: "360"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - book-files:/var/lib/english-reader/books
      - ./imports:/imports:ro
    ports:
      - "127.0.0.1:18081:8081"

  envoy:
    image: envoyproxy/envoy:v1.32-latest
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ../../backend/deployments/envoy/envoy.production.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "127.0.0.1:18082:8080"

  frontend:
    build:
      context: ../../frontend
      args:
        VITE_GRPC_WEB_URL: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env}
        VITE_HTTP_API_URL: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"

volumes:
  postgres-data:
  book-files:
  libretranslate-models:
