# Append this block to /opt/remnawave/nginx.conf on the server.
# The certificate paths must exist before reloading remnawave-nginx.
server {
    server_name krylov.reader.mooo.com;
    listen unix:/dev/shm/nginx.sock ssl proxy_protocol;
    http2 on;

    ssl_certificate "/etc/nginx/ssl/krylov.reader.mooo.com/fullchain.pem";
    ssl_certificate_key "/etc/nginx/ssl/krylov.reader.mooo.com/privkey.pem";
    ssl_trusted_certificate "/etc/nginx/ssl/krylov.reader.mooo.com/fullchain.pem";

    client_max_body_size 55m;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/reader\.v1\.[A-Za-z]+Service/ {
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:18082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
