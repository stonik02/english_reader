services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reader
      POSTGRES_USER: reader
      POSTGRES_PASSWORD: reader
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reader -d reader"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  libretranslate:
    image: libretranslate/libretranslate:latest
    environment:
      LT_LOAD_ONLY: en,ru
      LT_UPDATE_MODELS: "true"
      LT_THREADS: "4"
    volumes:
      - libretranslate-models:/home/libretranslate/.local:rw

  api:
    profiles: ["app"]
    build:
      context: .
    environment:
      APP_ENV: development
      GRPC_ADDR: :9090
      HTTP_ADDR: :8081

      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      DATABASE_URL: postgres://reader:reader@postgres:5432/reader?sslmode=disable
      JWT_SECRET: development-only-change-this-secret-key
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 720h
      SHUTDOWN_TIMEOUT: 10s
      BOOK_STORAGE_PATH: /var/lib/english-reader/books
      TRANSLATE_URL: http://libretranslate:5000
      TRANSLATE_TIMEOUT: 3s
      TRANSLATE_CACHE_TTL: 168h
      LOOKUP_WORD_MAX_LENGTH: "96"
      LOOKUP_SENTENCE_MAX_LENGTH: "1000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - book-files:/var/lib/english-reader/books
    ports:
      - "${API_HTTP_PORT:-8083}:8081"

  envoy:
    profiles: ["app"]
    image: envoyproxy/envoy:v1.32-latest
    depends_on:
      - api
    ports:
      - "${ENVOY_PORT:-8082}:8080"
    volumes:
      - ./deployments/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro

volumes:
  postgres-data:
  book-files:
  libretranslate-models:
