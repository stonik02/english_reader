openapi: 3.0.3
info:
  title: English Reader HTTP API
  version: 0.1.0
paths:
  /health/live:
    get:
      summary: Liveness probe
      responses: { '200': { description: Process is alive } }
  /health/ready:
    get:
      summary: Readiness probe
      responses: { '200': { description: Database is reachable }, '503': { description: Database is unavailable } }
  /api/v1/auth/register:
    post:
      summary: Register a family account
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } } }
      responses: { '201': { description: Session created, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }, '400': { description: Invalid input }, '409': { description: Email already registered } }
  /api/v1/auth/login:
    post:
      summary: Log in
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } } }
      responses: { '200': { description: Session created }, '401': { description: Invalid credentials } }
  /api/v1/auth/refresh:
    post:
      summary: Rotate the refresh session
      responses: { '200': { description: Session rotated }, '401': { description: Invalid refresh token } }
  /api/v1/auth/logout:
    post:
      summary: Revoke the current refresh session
      responses: { '204': { description: Session revoked } }
  /api/v1/auth/me:
    get:
      summary: Return the current account
      security: [ { bearerAuth: [] } ]
      responses: { '200': { description: Current user }, '401': { description: Invalid access token } }
components:
  securitySchemes: { bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT } }
  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties: { email: { type: string, format: email }, password: { type: string, format: password }, device_label: { type: string } }
    AuthResponse:
      type: object
      properties: { user: { $ref: '#/components/schemas/User' }, access_token: { type: string }, access_token_expires_at: { type: string, format: date-time } }
    User:
      type: object
      properties: { id: { type: string, format: uuid }, email: { type: string, format: email }, created_at: { type: string, format: date-time } }
